name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Hermes ${{ matrix.hermes }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "release" is Hermes's latest GitHub release (the plugin's behaviour on versions that
        # predate plugin start directories and Bot Desktop hosting); "main" has both.
        hermes: [release, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Get Hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global core.longpaths true
          if [ "${{ matrix.hermes }}" = "release" ]; then
            ref=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          else
            ref=main
          fi
          echo "Hermes ref: $ref"
          git clone --depth 1 --branch "$ref" https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" log -1 --format='Hermes %H'
      - name: Install Hermes, the plugin and its tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          python -m pip install -e ".[test]"
      - name: Show which PowerShell and bash the Windows tests will use
        shell: bash
        run: |
          command -v pwsh || true
          command -v powershell || true
          command -v bash
      - name: Run the tests
        run: python -m pytest -q -rs
